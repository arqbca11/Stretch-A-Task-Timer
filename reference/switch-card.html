<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#D9E0E1;
    --card:#FAFAF8;
    --ink:#101A19;
    --muted:#63736F;
    --line:rgba(16,26,25,.16);
    --accent:#0E5A4E;
    --accent-soft:rgba(14,90,78,.10);
    --over:#8A4A16;
    --focus:#0E5A4E;
    --idle:#625F99;
    --idle-soft:rgba(98,95,153,.09);
    --table:#E4EBE5;
    --t-I:#0E5A4E; --t-O:#B8902A; --t-T:#625F99; --t-S:#4E8757;
    --t-Z:#A5523A; --t-J:#2E5C8A; --t-L:#80644A;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1517;
      --card:#182124;
      --ink:#E6EDEA;
      --muted:#8CA09B;
      --line:rgba(230,237,234,.16);
      --accent:#5FC7AB;
      --accent-soft:rgba(95,199,171,.12);
      --over:#E0A46A;
      --focus:#5FC7AB;
      --idle:#ADAAE6;
      --idle-soft:rgba(173,170,230,.10);
      --table:#1F2926;
      --t-I:#5FC7AB; --t-O:#E0C06A; --t-T:#ADAAE6; --t-S:#8CCB93;
      --t-Z:#E39A7F; --t-J:#8DB5E3; --t-L:#C9A887;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1517;
    --card:#182124;
    --ink:#E6EDEA;
    --muted:#8CA09B;
    --line:rgba(230,237,234,.16);
    --accent:#5FC7AB;
    --accent-soft:rgba(95,199,171,.12);
    --over:#E0A46A;
    --focus:#5FC7AB;
    --idle:#ADAAE6;
    --idle-soft:rgba(173,170,230,.10);
    --table:#1F2926;
    --t-I:#5FC7AB; --t-O:#E0C06A; --t-T:#ADAAE6; --t-S:#8CCB93;
    --t-Z:#E39A7F; --t-J:#8DB5E3; --t-L:#C9A887;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Karla",ui-sans-serif,system-ui,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:32px 20px 64px;
  }
  .wrap{max-width:560px;margin:0 auto}

  .datehead{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    font-size:14px;color:var(--muted);margin:0 2px 14px;
  }
  .datehead b{font-weight:700;color:var(--ink)}

  /* the dial is the table the die rolls on: a flat, very slightly green surface */
  .dial{
    background:var(--table);
    border:1px solid var(--line);
    border-radius:4px;
    padding:30px 26px 24px;
  }


  .readout{display:flex;align-items:flex-end;gap:12px;min-height:118px}
  .numeral{
    font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
    font-weight:800;
    font-size:clamp(76px,20vw,118px);
    line-height:.82;
    letter-spacing:-.045em;
    font-variant-numeric:tabular-nums;
  }
  .numeral.idle{color:var(--muted);opacity:.45}
  .numeral.live{color:var(--accent)}
  .unit{font-size:15px;color:var(--muted);padding-bottom:10px}

  .die-wrap{position:relative;align-self:flex-end;cursor:pointer;border:0;background:transparent;
    padding:0;margin:0 22px 2px 2px;transition:opacity .22s ease, transform .22s ease}
  .die-wrap.vanish{opacity:0;transform:scale(.55)}
  .die-lift{perspective:420px;will-change:transform;transform-origin:50% 100%}
  .die{position:relative;width:76px;height:76px;transform-style:preserve-3d}
  /* the die is ray-traced into this canvas; it's larger than the 76px box so rotated corners fit */
  .die canvas{position:absolute;left:-32px;top:-32px;width:140px;height:140px;pointer-events:none}
  /* shadow on the table: sits outside the hopping part so it stays put and stretches away from the lamp */
  .die-shadow{position:absolute;left:-32px;top:56px;width:200px;height:70px;pointer-events:none}
  .numeral.pop{animation:pop .34s cubic-bezier(.2,.8,.3,1.25)}
  @keyframes pop{from{opacity:0;transform:scale(.7)} to{opacity:1;transform:scale(1)}}
  .sub{font-size:14px;color:var(--muted);margin-top:14px;min-height:21px}
  .sub .task{color:var(--ink);font-weight:700}

  .bar{height:3px;background:var(--line);margin-top:12px;position:relative;overflow:hidden}
  .bar span{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);transition:width .9s linear}
  .bar.over span{background:var(--over)}

  .controls{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .row-start{display:flex;gap:10px;flex:1 1 100%;flex-wrap:wrap}

  button{
    font-family:inherit;font-size:15px;font-weight:700;
    padding:11px 20px;border-radius:3px;cursor:pointer;
    border:1px solid var(--accent);background:var(--accent);
    color:var(--card);
    transition:opacity .15s ease;
  }
  button:hover{opacity:.86}
  button.ghost{background:transparent;color:var(--accent)}
  button.quiet{background:transparent;border-color:transparent;color:var(--muted);font-weight:500;padding:11px 6px}
  button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  input.task-in{
    flex:1 1 200px;min-width:0;
    font-family:inherit;font-size:15px;color:var(--ink);
    background:transparent;border:0;border-bottom:1px solid var(--line);
    padding:11px 2px;
  }
  input.task-in::placeholder{color:var(--muted)}
  input.task-in:focus{border-bottom-color:var(--accent);outline:none}

  .game{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px}
  .game-grid{display:flex;gap:20px;align-items:flex-start}
  #board{display:block;flex:0 0 auto;border:1px solid var(--line);border-radius:2px;touch-action:none}
  #board:focus{outline:none}
  #board:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .game-side{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:12px}
  .g-total{
    font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
    font-weight:800;font-size:40px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  }
  .g-label{font-size:13px;color:var(--muted);margin-top:6px}
  .g-stats{font-size:13px;color:var(--muted);line-height:1.75}
  .g-stats b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  .g-bank{font-size:14px;line-height:1.45}
  .g-bank b{color:var(--accent)}
  .g-next{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .pad{display:grid;grid-template-columns:repeat(3,42px);gap:6px}
  .pad button{padding:0;height:38px;font-size:17px;font-weight:500;background:transparent;color:var(--accent);border-color:var(--line)}
  .pad .wide{grid-column:1 / -1;font-size:14px;font-weight:700}
  .g-msg{font-size:13px;color:var(--muted);min-height:19px}
  @media (max-width:420px){ .game{padding:14px} .game-grid{gap:14px} .g-total{font-size:32px} }

  .log{margin-top:34px}
  .log h2{
    font-family:inherit;font-size:14px;font-weight:700;margin:0 2px 10px;
    display:flex;justify-content:space-between;gap:4px 10px;align-items:baseline;flex-wrap:wrap;
  }
  .log h2 em{font-style:normal;font-weight:400;color:var(--muted)}

  /* each row is a bar: its height is proportional to its minutes (set inline from BAR_PX_PER_MIN) */
  .entry{
    display:flex;align-items:flex-start;gap:10px;
    padding:7px 10px;margin-bottom:3px;border-radius:3px;
    background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent);
    transition:min-height .4s ease;
  }
  .entry.running{box-shadow:inset 4px 0 0 var(--accent);padding-left:12px}
  .entry .name{
    flex:1 1 auto;min-width:0;font-size:15px;
    border:0;background:transparent;color:var(--ink);font-family:inherit;padding:2px 0;
    text-overflow:ellipsis;
  }
  .entry .name:focus{outline:none;border-bottom:1px solid var(--accent)}
  .nums{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);white-space:nowrap}
  .nums input{
    width:3.2ch;text-align:right;font-family:inherit;font-size:15px;
    border:0;background:transparent;color:var(--muted);padding:2px 0;
    font-variant-numeric:tabular-nums;
  }
  .nums input.done{color:var(--ink);font-weight:700}
  .nums input:focus{outline:none;border-bottom:1px solid var(--accent)}
  .nums .arrow{color:var(--line);padding:0 2px}
  .nums .min{font-size:13px}
  .entry.idle{background:var(--idle-soft);box-shadow:inset 2px 0 0 var(--idle);padding-left:10px}
  .entry.idle .name,.entry.idle .nums,.entry.idle .nums input{color:var(--idle)}
  .entry.idle .nums input.done{font-weight:500}
  .nums .range{font-size:13px;margin-right:8px}
  .nums .auto{font-size:12px;font-style:italic;margin-left:4px}
  .del{
    border:0;background:transparent;color:var(--muted);font-size:16px;font-weight:400;
    padding:2px 4px;line-height:1;opacity:0;cursor:pointer;
  }
  .entry:hover .del,.del:focus-visible{opacity:1}

  .empty{color:var(--muted);font-size:14px;padding:10px 2px;border-top:1px solid var(--line)}
  .entry .tag{flex:0 0 auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;line-height:18px}
  .add-log{margin-top:12px;width:100%;background:transparent;border:1px dashed var(--line);color:var(--accent);padding:10px}
  .add-log:hover{background:var(--accent-soft);opacity:1}
  .mform{margin-top:12px;border:1px solid var(--line);border-radius:4px;background:var(--card);padding:14px;
    display:flex;flex-direction:column;gap:12px}
  .mform .times{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
  .mform input[type=time]{font-family:inherit;font-size:15px;color:var(--ink);background:transparent;
    border:0;border-bottom:1px solid var(--line);padding:6px 2px}
  .mform input[type=time]:focus{outline:none;border-bottom-color:var(--accent)}
  .mform .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .mform .err{font-size:13px;color:var(--over)}

  details.past{margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
  details.past > summary{
    display:inline-block;cursor:pointer;list-style:none;
    font-size:14px;font-weight:700;color:var(--accent);
    border:1px solid var(--line);border-radius:3px;padding:8px 14px;
  }
  details.past > summary:hover{background:var(--accent-soft)}
  details.past > summary::-webkit-details-marker{display:none}
  details.past > summary::before{content:"▸ ";font-size:11px}
  details.past[open] > summary::before{content:"▾ "}
  .day{margin:16px 0 22px}
  .day h3{font-size:14px;font-weight:700;margin:0 2px 8px;display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
  .day h3 em{font-style:normal;font-weight:400;color:var(--muted)}
  .day .entry{padding:6px 10px}

  .note{margin-top:26px;font-size:13px;color:var(--muted);line-height:1.6}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="datehead"><b id="today-label">Today</b><span id="save-note"></span></div>

  <section class="dial">
    <div class="readout">
      <button class="die-wrap" id="die-wrap" aria-label="Roll a number">
        <canvas class="die-shadow" id="die-shadow"></canvas>
        <div class="die-lift" id="die-lift"><div class="die" id="die"></div></div>
      </button>
      <div class="numeral" id="numeral" hidden></div>
      <div class="unit" id="unit">minutes</div>
    </div>
    <div class="sub" id="sub">Roll a number, name the task, start.</div>
    <div class="bar" id="bar" hidden><span id="barfill"></span></div>

    <div class="controls" id="controls"></div>
  </section>

  <section class="game" aria-label="Reward game">
    <div class="game-grid">
      <canvas id="board" tabindex="0" aria-label="Tetris board. Arrow keys move, up rotates, space drops."></canvas>
      <div class="game-side">
        <div>
          <div class="g-total" id="g-total">0</div>
          <div class="g-label">total score</div>
        </div>
        <div class="g-stats" id="g-stats"></div>
        <div class="g-bank" id="g-bank"></div>
        <div id="g-actions"></div>
        <div class="g-next" id="g-next-wrap" hidden><canvas id="g-next"></canvas><span>next</span></div>
        <div class="pad" id="pad" hidden>
          <span></span><button data-act="rotate" aria-label="Rotate">&#8635;</button><span></span>
          <button data-act="left" aria-label="Left">&larr;</button><button data-act="down" aria-label="Down">&darr;</button><button data-act="right" aria-label="Right">&rarr;</button>
          <button class="wide" data-act="drop">Drop</button>
        </div>
        <div class="g-msg" id="g-msg" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <section class="log">
    <h2><span>Today</span><em id="today-summary"></em></h2>
    <div id="today-entries"></div>
    <div id="manual"></div>
  </section>

  <details class="past" id="past">
    <summary id="past-summary">Earlier days</summary>
    <div id="past-body"></div>
  </details>

  <p class="note">Edit any row, today or earlier: rename the task, or fix the planned and worked minutes by typing over them.</p>
</div>

<script>
(function(){
  "use strict";

  var MIN = 30, MAX = 100;
  var LS_KEY = "switchcard.days.v1";
  var REMOTE_LIMIT = 120;
  var AUTO_LOG_MS = 3 * 60 * 60 * 1000;   // unfinished blocks auto-log at 3h
  var DAY_START_H = 8, DAY_START_M = 30;  // idle before the first block counts from 8:30

  var state = { days: {}, rolled: null, rolling: false, prefill: "" };
  var db = null;
  var tickTimer = null;
  var renderedDay = null;

  /* ---------- dates ---------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function keyOf(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  // A "day" runs 4:30 am to 4:30 am: anything before 4:30 belongs to the night before.
  var ROLL_MIN = 4 * 60 + 30;
  function minuteOfDay(d){ return d.getHours() * 60 + d.getMinutes(); }
  function dayKeyAt(ts){
    var d = new Date(ts);
    if (minuteOfDay(d) < ROLL_MIN) d.setDate(d.getDate() - 1);
    return keyOf(d);
  }
  function todayKey(){ return dayKeyAt(Date.now()); }
  function prettyDate(key){
    var p = key.split("-");
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
  }
  // "12:00–12:40 PM" rather than "12:00 PM–12:40 PM" when both share a suffix
  function rangeText(a, b){
    var x = clockOf(a), y = clockOf(b);
    var sx = x.split(/\s+/), sy = y.split(/\s+/);
    if (sx.length === 2 && sy.length === 2 && sx[1] === sy[1]) x = sx[0];
    return x + "\u2013" + y;
  }
  function clockOf(ts){
    return new Date(ts).toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
  }

  /* ---------- storage ---------- */
  function clone(v){ return v == null ? v : JSON.parse(JSON.stringify(v)); }
  function readLocal(){
    try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; }
    catch(e){ return {}; }
  }
  function writeLocal(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state.days)); } catch(e){}
  }
  function dayDoc(key){
    var d = state.days[key];
    if (!d) { d = { date:key, entries:[], updatedAt:0 }; state.days[key] = d; }
    return d;
  }
  function pushRemote(key){
    if (!db) return;
    var d = state.days[key];
    if (!d) return;
    try {
      db.doc("days/" + key)
        .set({ date: d.date, entries: d.entries, updatedAt: d.updatedAt || 0 })
        .catch(function(){});
    } catch(e){}
  }
  function persist(key){
    var d = state.days[key];
    if (!d) return;
    d.updatedAt = Date.now();
    writeLocal();
    pushRemote(key);
  }

  // Re-file any entry whose start time belongs to a different day than the one it's stored
  // under (e.g. blocks started after midnight before the 4:30 roll-over existed).
  function normalizeDays(){
    var touched = {};
    Object.keys(state.days).forEach(function(k){
      var d = state.days[k], keep = [];
      d.entries.forEach(function(e){
        var want = e.startedAt ? dayKeyAt(e.startedAt) : k;
        if (want === k) keep.push(e);
        else { dayDoc(want).entries.push(e); touched[want] = true; touched[k] = true; }
      });
      d.entries = keep;
    });
    Object.keys(touched).forEach(function(k){
      state.days[k].entries.sort(function(a, b){ return (a.startedAt || 0) - (b.startedAt || 0); });
      persist(k);
    });
    return Object.keys(touched).length > 0;
  }

  async function connect(){
    if (!window.claude || typeof window.claude.use !== "function") return;
    var ns = null;
    try { ns = await window.claude.use("db"); } catch(e){ ns = null; }
    if (!ns) return;
    db = ns;
    try {
      var snap = await db.collection("days").orderBy("date","desc").limit(REMOTE_LIMIT).get();
      var remote = {}, oldest = null;
      snap.docs.forEach(function(doc){
        var v = clone(doc.data());   // snapshot bodies are frozen; work on a copy
        if (v && v.date && Array.isArray(v.entries)){
          remote[v.date] = { date:v.date, entries:v.entries, updatedAt:v.updatedAt || 0 };
          if (!oldest || v.date < oldest) oldest = v.date;
        }
      });
      var complete = snap.docs.length < REMOTE_LIMIT;
      var keys = Object.keys(remote);
      Object.keys(state.days).forEach(function(k){ if (keys.indexOf(k) < 0) keys.push(k); });
      keys.forEach(function(k){
        var l = state.days[k], r = remote[k];
        if (r && (!l || (r.updatedAt || 0) >= (l.updatedAt || 0))){
          state.days[k] = r;                       // server copy is as new or newer
        } else if (l && (r || complete || (oldest && k >= oldest))){
          pushRemote(k);                           // local copy is newer, or server lacks it
        }
      });
      normalizeDays();
      writeLocal();
      render();
    } catch(e){}
  }

  /* ---------- model ---------- */
  // The running block is the newest unfinished entry started in the last 3h,
  // whichever day it belongs to (a block belongs to the day it started).
  function findRunning(){
    var best = null;
    var now = Date.now();
    Object.keys(state.days).forEach(function(k){
      state.days[k].entries.forEach(function(e){
        if (e.type !== "idle" && e.startedAt && e.worked == null && now - e.startedAt < AUTO_LOG_MS){
          if (!best || e.startedAt > best.entry.startedAt) best = { entry:e, key:k };
        }
      });
    });
    return best;
  }
  // Any block left unfinished for 3h is logged as 180 min, flagged "auto".
  function autoLogStale(){
    var now = Date.now(), changed = false;
    Object.keys(state.days).forEach(function(k){
      var touched = false;
      state.days[k].entries.forEach(function(e){
        if (e.type !== "idle" && e.startedAt && e.worked == null && now - e.startedAt >= AUTO_LOG_MS){
          e.worked = Math.round(AUTO_LOG_MS / 60000);
          e.endedAt = e.startedAt + AUTO_LOG_MS;
          e.auto = true;
          e.reward = 0;
          touched = true;
        }
      });
      if (touched){ persist(k); changed = true; }
    });
    return changed;
  }

  function endOf(e){
    if (e.endedAt) return e.endedAt;
    if (e.startedAt && e.worked != null) return e.startedAt + e.worked * 60000;
    return null;
  }

  // Idle gap to log before a block starting at `now` on day `key`:
  // from the latest end time in the day, or from 8:30 if the day is empty.
  function idleBefore(key, now){
    var day = state.days[key];
    var from = null;
    if (!day || !day.entries.length){
      var p = key.split("-");
      var dayStart = new Date(+p[0], +p[1]-1, +p[2], DAY_START_H, DAY_START_M).getTime();
      if (now <= dayStart) return null;
      from = dayStart;
    } else {
      day.entries.forEach(function(e){
        var end = endOf(e);
        if (end && (from == null || end > from)) from = end;
      });
      if (from == null) return null;
    }
    var mins = Math.floor((now - from) / 60000);
    if (mins < 1) return null;
    return {
      id: "idle" + String(now) + Math.random().toString(36).slice(2,6),
      type: "idle",
      task: "idle",
      planned: null,
      startedAt: from,
      endedAt: now,
      worked: mins
    };
  }

  function elapsedMin(e){ return Math.max(0, Math.floor((Date.now() - e.startedAt) / 60000)); }

  /* ---------- die ---------- */
  // Chinese-style die: the 1 and the 4 are red.
  // cube rotation (x, y in degrees) that brings each face to the front

      for (var c = 0; c < COLS; c++){
        var k = game.board[r].charAt(c);
        if (k !== "."){ ctx.fillStyle = t[k] || t.line; ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2); }
      }
    }
    if (piece){
      var gy = piece.y;
      while (!collides(piece.m, piece.x, gy + 1)) gy++;
      ctx.strokeStyle = t[piece.k]; ctx.globalAlpha = .45;
      eachCell(piece.m, function(cc, rr){
        if (gy + rr >= 0) ctx.strokeRect((piece.x + cc) * CELL + 1.5, (gy + rr) * CELL + 1.5, CELL - 3, CELL - 3);
      });
      ctx.globalAlpha = 1; ctx.fillStyle = t[piece.k];
      eachCell(piece.m, function(cc, rr){
        if (piece.y + rr >= 0) ctx.fillRect((piece.x + cc) * CELL + 1, (piece.y + rr) * CELL + 1, CELL - 2, CELL - 2);
      });
    }
    drawNext(t);
  }
  function eachCell(m, fn){
    for (var r = 0; r < m.length; r++) for (var c = 0; c < m[r].length; c++) if (m[r][c]) fn(c, r);
  }
  function drawNext(t){
    var wrap = document.getElementById("g-next-wrap");
    var show = piece && game.bank > 1;
    wrap.hidden = !show;
    if (!show) return;
    var k = peekKind(), m = SHAPES[k];
    var cv = document.getElementById("g-next");
    var ctx = setupCanvas(cv, 4 * NCELL, 2 * NCELL);
    ctx.clearRect(0, 0, 4 * NCELL, 2 * NCELL);
    ctx.fillStyle = t[k];
    var rows = m.filter(function(row){ return row.some(Boolean); });
    var w = rows[0].length, ox = (4 - w) / 2;
    rows.forEach(function(row, rr){
      row.forEach(function(v, cc){ if (v) ctx.fillRect((ox + cc) * NCELL + 1, rr * NCELL + 1, NCELL - 2, NCELL - 2); });
    });
  }

  function renderGameSide(){
    if (!game) return;
    document.getElementById("g-total").textContent = game.total.toLocaleString();
    document.getElementById("g-stats").innerHTML =
      "This game <b>" + game.score.toLocaleString() + "</b><br>" +
      "Best game <b>" + game.best.toLocaleString() + "</b><br>" +
      "Game <b>" + game.games + "</b>, <b>" + game.lines + "</b> lines total";
    var bank = document.getElementById("g-bank");
    if (piece){
      var left = game.bank - 1;
      bank.innerHTML = left > 0 ? "Playing. <b>" + left + "</b> more after this one." : "Playing your last piece.";
    } else if (game.bank > 0){
      bank.innerHTML = "<b>" + game.bank + "</b> " + (game.bank === 1 ? "piece" : "pieces") + " to play.";
    } else {
      bank.textContent = "Each logged block earns pieces: more for longer blocks and for running a bit over.";
    }
    var actions = document.getElementById("g-actions");
    actions.innerHTML = "";
    if (!piece && game.bank > 0){
      var b = document.createElement("button");
      b.className = "ghost";
      b.textContent = "Play";
      b.onclick = function(){ spawn(); document.getElementById("board").focus(); };
      actions.appendChild(b);
    }
    document.getElementById("pad").hidden = !piece;
  }

  function padAction(act){
    if (!piece) return;
    if (act === "left") move(-1, 0);
    else if (act === "right") move(1, 0);
    else if (act === "down"){ if (!move(0, 1)){ lock(); return; } }
    else if (act === "rotate") rotatePiece();
    else if (act === "drop"){ hardDrop(); return; }
    drawGame();
  }
  Array.prototype.forEach.call(document.querySelectorAll("#pad button"), function(btn){
    btn.tabIndex = -1;
    btn.addEventListener("pointerdown", function(ev){ ev.preventDefault(); });
    btn.addEventListener("click", function(){ padAction(btn.getAttribute("data-act")); });
  });

  function backfillRewards(){
    if (game.backfilled) return;
    var k = todayKey(), d = state.days[k], n = 0;
    if (d) d.entries.forEach(function(e){
      if (e.type !== "idle" && e.worked != null && !e.auto && e.reward == null){
        e.reward = rewardFor(e).n;
        n += e.reward;
      }
    });
    game.backfilled = true;
    if (n){ persist(k); game.bank += n; setMsg("+" + n + " pieces for today's blocks so far."); }
    saveGame();
    renderGameSide(); drawGame();
  }

  async function connectGame(){
    if (!db) return;
    try {
      var snap = await db.doc("game/state").get();
      var rg = snap.exists ? clone(snap.data()) : null;   // frozen snapshot -> mutable copy
      if (validGame(rg) && (rg.updatedAt || 0) >= (game.updatedAt || 0)){
        if (!piece){ game = rg; try { localStorage.setItem(GAME_KEY, JSON.stringify(game)); } catch(e){} }
      } else if (game.updatedAt){
        pushGame();
      }
    } catch(e){}
  }

  /* ---------- log without rolling ---------- */
  var manualOpen = false;
  function hhmm(ts){ var d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  // a clock time on day `key`, where times before 4:30 fall after midnight
  function tsOn(key, value){
    var p = key.split("-"), t = value.split(":");
    var h = +t[0], m = +t[1];
    var d = new Date(+p[0], +p[1]-1, +p[2], h, m);
    if (h * 60 + m < ROLL_MIN) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function latestEnd(day){
    var best = null;
    day.entries.forEach(function(e){ var end = endOf(e); if (end && (best == null || end > best)) best = end; });
    return best;
  }
  // remove the span [s, e] from any idle rows it overlaps (trim, split, or drop)
  function carveIdle(day, s, e){
    var out = [];
    day.entries.forEach(function(x){
      if (x.type !== "idle" || x.endedAt <= s || x.startedAt >= e){ out.push(x); return; }
      var pieces = [];
      if (x.startedAt < s) pieces.push([x.startedAt, s]);
      if (x.endedAt > e) pieces.push([e, x.endedAt]);
      pieces.forEach(function(pc, i){
        var mins = Math.floor((pc[1] - pc[0]) / 60000);
        if (mins < 1) return;
        var y = clone(x);
        if (i > 0) y.id = x.id + "b";
        y.startedAt = pc[0]; y.endedAt = pc[1]; y.worked = mins;
        out.push(y);
      });
    });
    day.entries = out;
  }

  function logManual(task, startVal, endVal){
    var key = todayKey();
    if (!startVal || !endVal) return "Pick a start and an end time.";
    var s = tsOn(key, startVal), e = tsOn(key, endVal);
    if (e <= s) return "The end has to be after the start.";
    if (e > Date.now() + 60000) return "That end time hasn't happened yet.";
    var mins = Math.round((e - s) / 60000);
    if (mins < 1) return "That's under a minute.";
    var day = dayDoc(key);
    var last = latestEnd(day);
    if (last == null || s >= last){
      var gap = idleBefore(key, s);      // same idle rule as a rolled start
      if (gap) day.entries.push(gap);
    } else {
      carveIdle(day, s, e);              // filling in a gap that was logged as idle
    }
    var entry = {
      id: "m" + String(Date.now()) + Math.random().toString(36).slice(2,6),
      type: "manual",
      task: task || "Untitled",
      planned: null,
      startedAt: s,
      endedAt: e,
      worked: mins
    };
    var rw = rewardFor(entry);
    entry.reward = rw.n;
    day.entries.push(entry);
    day.entries.sort(function(a, b){ return (a.startedAt || 0) - (b.startedAt || 0); });
    persist(key);
    grantPieces(rw);
    return null;
  }

  function renderManual(){
    var box = document.getElementById("manual");
    box.innerHTML = "";
    if (!manualOpen){
      var add = document.createElement("button");
      add.className = "add-log";
      add.textContent = "+ Log something you did without rolling";
      add.onclick = function(){ manualOpen = true; renderManual(); document.getElementById("m-task").focus(); };
      box.appendChild(add);
      return;
    }
    var now = Date.now();
    var form = document.createElement("div");
    form.className = "mform";
    form.innerHTML =
      '<input class="task-in" id="m-task" type="text" placeholder="What did you do?" autocomplete="off">' +
      '<div class="times"><input type="time" id="m-start" aria-label="Start time"><span>to</span>' +
      '<input type="time" id="m-end" aria-label="End time"><span id="m-len"></span></div>' +
      '<div class="err" id="m-err" hidden></div>' +
      '<div class="acts"><button id="m-log">Log it</button><button class="quiet" id="m-cancel">Cancel</button></div>';
    box.appendChild(form);
    var st = document.getElementById("m-start"), en = document.getElementById("m-end");
    st.value = hhmm(now - 30 * 60000); en.value = hhmm(now);
    function showLen(){
      var el = document.getElementById("m-len");
      if (!st.value || !en.value){ el.textContent = ""; return; }
      var k = todayKey(), m = Math.round((tsOn(k, en.value) - tsOn(k, st.value)) / 60000);
      el.textContent = m > 0 ? m + " min" : "";
    }
    st.oninput = showLen; en.oninput = showLen; showLen();
    function submit(){
      var err = logManual(document.getElementById("m-task").value.trim(), st.value, en.value);
      var eb = document.getElementById("m-err");
      if (err){ eb.hidden = false; eb.textContent = err; return; }
      manualOpen = false;
      renderManual();
      render();
    }
    document.getElementById("m-log").onclick = submit;
    document.getElementById("m-task").onkeydown = function(ev){ if (ev.key === "Enter") submit(); };
    document.getElementById("m-cancel").onclick = function(){ manualOpen = false; renderManual(); };
  }

  /* ---------- render ---------- */
  function render(){
    autoLogStale();
    renderedDay = todayKey();
    document.getElementById("today-label").textContent = prettyDate(renderedDay) +
      (keyOf(new Date()) !== renderedDay ? " (late night)" : "");
    renderDial();
    renderToday();
    renderPast();
    manageTick();
  }

  function renderDial(){
    var numeral = document.getElementById("numeral");
    var unit = document.getElementById("unit");
    var sub = document.getElementById("sub");
    var bar = document.getElementById("bar");
    var fill = document.getElementById("barfill");
    var controls = document.getElementById("controls");
    controls.innerHTML = "";

    var r = findRunning();
    var showDie = !(r && !state.rolling) && (state.rolled == null || state.rolling);
    wrapEl.hidden = !showDie;
    numeral.hidden = showDie;
    if (showDie && !state.rolling) wrapEl.classList.remove("vanish");

    if (r && !state.rolling){
      var run = r.entry;
      var mins = elapsedMin(run);
      numeral.className = "numeral live";
      numeral.textContent = mins;
      unit.textContent = "of " + run.planned + " min";
      sub.innerHTML = "";
      var strong = document.createElement("span");
      strong.className = "task";
      strong.textContent = run.task;
      sub.appendChild(strong);
      sub.appendChild(document.createTextNode(
        " \u00b7 started " + clockOf(run.startedAt) +
        (r.key !== todayKey() ? " yesterday" : "") +
        (mins > run.planned ? " \u00b7 " + (mins - run.planned) + " over" : "")
      ));
      bar.hidden = false;
      fill.style.width = Math.min(100, (mins / run.planned) * 100) + "%";
      bar.className = mins > run.planned ? "bar over" : "bar";

      var done = document.createElement("button");
      done.textContent = "Done, log it";
      done.onclick = finish;
      var more = document.createElement("button");
      more.className = "ghost";
      more.textContent = "Keep going";
      more.title = "Log this block and roll a new number for the same task";
      more.onclick = keepGoing;
      controls.appendChild(done);
      controls.appendChild(more);
      return;
    }

    bar.hidden = true;

    if (state.rolling || state.rolled == null){
      unit.textContent = "minutes";
      if (state.rolling === "rolling"){
        sub.textContent = "Rolling. Stop it whenever you like.";
        var stop = document.createElement("button");
        stop.textContent = "Stop";
        stop.onclick = stopRoll;
        controls.appendChild(stop);
      } else if (state.rolling === "landing"){
        sub.textContent = "Rolling. Stop it whenever you like.";
      } else {
        sub.textContent = "Roll a number, name the task, start.";
        var b = document.createElement("button");
        b.textContent = "Roll a number";
        b.onclick = roll;
        controls.appendChild(b);
      }
      return;
    }

    numeral.className = "numeral" + (state.justLanded ? " pop" : "");
    state.justLanded = false;
    numeral.textContent = state.rolled;
    unit.textContent = "minutes";
    sub.textContent = state.prefill
      ? "Next block. Set the stopwatch to " + state.rolled + " and start."
      : "What gets these " + state.rolled + " minutes?";

    var row = document.createElement("div");
    row.className = "row-start";
    var input = document.createElement("input");
    input.className = "task-in";
    input.id = "task-in";
    input.type = "text";
    input.placeholder = "Task name";
    input.autocomplete = "off";
    input.value = state.prefill || "";
    input.onkeydown = function(ev){ if (ev.key === "Enter") startTask(); };
    var go = document.createElement("button");
    go.textContent = "Start";
    go.onclick = startTask;
    var again = document.createElement("button");
    again.className = "quiet";
    again.textContent = "Reroll";
    again.onclick = roll;
    row.appendChild(input); row.appendChild(go); row.appendChild(again);
    controls.appendChild(row);
  }

  function summarize(entries){
    var planned = 0, worked = 0, blocks = 0, idle = 0;
    entries.forEach(function(e){
      if (e.type === "idle"){ idle += e.worked || 0; return; }
      blocks++;
      planned += e.planned || 0;
      if (e.worked != null) worked += e.worked;
    });
    if (!entries.length) return "";
    var out = blocks + (blocks === 1 ? " block" : " blocks") +
      " \u00b7 " + planned + " planned \u00b7 " + worked + " worked";
    if (idle) out += " \u00b7 " + idle + " idle";
    return out;
  }

  // bar height: linear in minutes, with a floor so short blocks stay readable and a cap for very long idles
  var BAR_PX_PER_MIN = 1.2, BAR_MIN_PX = 34, BAR_MAX_PX = 480;
  function barPx(mins){
    var h = (mins || 0) * BAR_PX_PER_MIN;
    return Math.round(h < BAR_MIN_PX ? BAR_MIN_PX : h > BAR_MAX_PX ? BAR_MAX_PX : h);
  }
  function entryRow(e, key, runningId){
    var isIdle = e.type === "idle";
    var isManual = e.type === "manual";
    var isRunning = e.id === runningId;
    var row = document.createElement("div");
    row.className = "entry" + (isIdle ? " idle" : "") + (isRunning ? " running" : "");
    var mins = e.worked != null ? e.worked : (isRunning ? elapsedMin(e) : 0);
    row.style.minHeight = barPx(mins) + "px";
    row.title = mins + " min";

    var name = document.createElement("input");
    name.className = "name";
    name.value = e.task;
    name.setAttribute("aria-label", "Task name");
    name.onchange = function(){ e.task = name.value.trim() || (isIdle ? "idle" : "Untitled"); persist(key); render(); };
    row.appendChild(name);
    if (isManual){
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "no roll";
      tag.title = "Logged after the fact, without rolling";
      row.appendChild(tag);
    }

    var nums = document.createElement("div");
    nums.className = "nums";

    if (isIdle || isManual){
      var range = document.createElement("span");
      range.className = "range";
      range.textContent = rangeText(e.startedAt, e.endedAt);
      nums.appendChild(range);
    } else {
    var p = document.createElement("input");
    p.value = e.planned;
    p.inputMode = "numeric";
    p.title = "minutes planned";
    p.setAttribute("aria-label", "Minutes planned");
    p.onchange = function(){
      var v = parseInt(p.value, 10);
      if (!isNaN(v)) e.planned = Math.max(1, v);
      persist(key); render();
    };
    nums.appendChild(p);

    var arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "\u2192";
    nums.appendChild(arrow);
    }

    var w = document.createElement("input");
    w.className = "done";
    w.value = e.worked == null ? "" : e.worked;
    w.placeholder = "\u2013";
    w.inputMode = "numeric";
    w.title = isIdle ? "minutes idle" : (e.auto ? "Auto-logged at 3 hours; edit if wrong" : "minutes worked");
    w.setAttribute("aria-label", isIdle ? "Minutes idle" : "Minutes worked");
    w.onchange = function(){
      var v = parseInt(w.value, 10);
      e.worked = isNaN(v) ? null : Math.max(0, v);
      e.auto = false;
      persist(key); render();
    };
    nums.appendChild(w);

    var min = document.createElement("span");
    min.className = "min";
    min.textContent = "min";
    nums.appendChild(min);
    if (e.auto){
      var a = document.createElement("span");
      a.className = "auto";
      a.textContent = "auto";
      nums.appendChild(a);
    }
    row.appendChild(nums);

    var del = document.createElement("button");
    del.className = "del";
    del.innerHTML = "&times;";
    del.title = "Remove";
    del.setAttribute("aria-label", "Remove " + e.task);
    del.onclick = function(){ removeEntry(key, e.id); };
    row.appendChild(del);
    return row;
  }

  function renderToday(){
    var key = todayKey();
    var day = state.days[key];
    var box = document.getElementById("today-entries");
    box.innerHTML = "";
    var entries = day ? day.entries : [];
    var r = findRunning();
    document.getElementById("today-summary").textContent = summarize(entries);
    if (!entries.length){
      var p = document.createElement("div");
      p.className = "empty";
      p.textContent = r ? "The running block started yesterday; it's logged there." : "Nothing logged yet today.";
      box.appendChild(p);
      return;
    }
    entries.forEach(function(e){ box.appendChild(entryRow(e, key, r && r.entry.id)); });
  }

  function renderPast(){
    var today = todayKey();
    var keys = Object.keys(state.days)
      .filter(function(k){ return k < today && state.days[k].entries.length; })
      .sort().reverse();
    var body = document.getElementById("past-body");
    body.innerHTML = "";
    document.getElementById("past-summary").textContent =
      keys.length ? "Earlier days (" + keys.length + ")" : "Earlier days";
    if (!keys.length){
      var p = document.createElement("div");
      p.className = "empty";
      p.style.marginTop = "14px";
      p.textContent = "No earlier days yet. Each day's log moves here after midnight.";
      body.appendChild(p);
      return;
    }
    var r = findRunning();
    keys.forEach(function(k){
      var d = state.days[k];
      var wrap = document.createElement("div");
      wrap.className = "day";
      var h = document.createElement("h3");
      var t = document.createElement("span");
      t.textContent = prettyDate(k);
      var s = document.createElement("em");
      s.textContent = summarize(d.entries);
      h.appendChild(t); h.appendChild(s);
      wrap.appendChild(h);
      d.entries.forEach(function(e){ wrap.appendChild(entryRow(e, k, r && r.entry.id)); });
      body.appendChild(wrap);
    });
  }

  function manageTick(){
    if (tickTimer){ clearInterval(tickTimer); tickTimer = null; }
    if (!findRunning()) return;
    tickTimer = setInterval(function(){
      var r = findRunning();
      if (!r){ render(); return; }
      var numeral = document.getElementById("numeral");
      if (numeral.textContent !== String(elapsedMin(r.entry))){
        renderDial();
        var h = barPx(elapsedMin(r.entry)) + "px";
        Array.prototype.forEach.call(document.querySelectorAll(".entry.running"), function(el){ el.style.minHeight = h; });
      }
      else {
        document.getElementById("barfill").style.width =
          Math.min(100, ((Date.now() - r.entry.startedAt) / 60000 / r.entry.planned) * 100) + "%";
      }
    }, 5000);
  }

  /* ---------- day rollover ---------- */
  function checkDay(){
    if (autoLogStale()){ render(); return; }
    if (todayKey() !== renderedDay && !state.rolling && !document.getElementById("task-in")) render();
  }
  setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) stopGravity();
    else { checkDay(); if (piece) startGravity(); }
  });

  /* ---------- boot ---------- */
  state.days = readLocal();
  normalizeDays();
  game = readLocalGame() || freshGame();
  render();
  renderManual();
  renderGameSide(); drawGame();
  connect()
    .then(connectGame)
    .catch(function(){})
    .then(function(){ backfillRewards(); renderGameSide(); drawGame(); });

  if (window.matchMedia){
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", function(){ drawGame(); readEnv(); drawDie(); });
  }

  document.addEventListener("keydown", function(ev){
    var tg = ev.target;
    var typing = tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA");
    if (piece && !typing){
      var handled = true;
      switch (ev.key){
        case "ArrowLeft": move(-1, 0); break;
        case "ArrowRight": move(1, 0); break;
        case "ArrowDown": if (!move(0, 1)){ lock(); ev.preventDefault(); return; } break;
        case "ArrowUp": case "x": case "X": rotatePiece(); break;
        case " ": ev.preventDefault(); hardDrop(); return;
        default: handled = false;
      }
      if (handled){ ev.preventDefault(); drawGame(); }
      return;
    }
    if (ev.key === " " && ev.target === document.body){
      ev.preventDefault();
      if (state.rolling === "rolling") stopRoll();
      else if (state.rolling) return;
      else if (findRunning()) finish();
      else if (state.rolled == null) roll();
    }
  });
})();
</script>
</body>
</html>
