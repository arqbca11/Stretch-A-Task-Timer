[package]
name = "stretch"
version = "0.1.0"
description = "Stretch: a macOS menu bar timeline for stretchy, parallel task blocks."
edition = "2021"

[lib]
name = "stretch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
